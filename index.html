</script><script>
(function () {
	const BUILD = '20261027174551';
	const CACHE = 'modlovag-files';
	const TYPES = { 'index.wasm': 'application/wasm', 'index.pck': 'application/octet-stream' };
	if (!window.caches || !window.ReadableStream) return;
	if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
	const networkFetch = window.fetch.bind(window);
	function dropOldBuilds(cache) {
		return cache.keys().then(function (requests) {
			return Promise.all(requests.filter(function (r) { return r.url.indexOf('?build=' + BUILD) === -1; })
				.map(function (r) { return cache.delete(r); }));
		});
	}
	// A halozati valaszt tovabbadja a Godotnak, es kozben gyujti; ha vegigert, elmenti.
	function storing(response, cache, key, type) {
		const reader = response.body.getReader();
		const chunks = [];
		const stream = new ReadableStream({
			pull: function (controller) {
				return reader.read().then(function (result) {
					if (result.done) {
						controller.close();
						const body = new Blob(chunks, { type: type });
						cache.put(key, new Response(body, { headers: { 'Content-Type': type } }))
							.then(function () { return dropOldBuilds(cache); }).catch(function () {});
						return;
					}
					chunks.push(result.value);
					controller.enqueue(result.value);
				});
			},
			cancel: function (reason) { return reader.cancel(reason); },
		});
		return new Response(stream, { status: response.status, headers: { 'Content-Type': type } });
	}
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		const name = url.split('?')[0].split('/').pop();
		const type = TYPES[name];
		if (!type) return networkFetch(input, init);
		const key = new URL(name + '?build=' + BUILD, location.href).href;
		return caches.open(CACHE).then(function (cache) {
			return cache.match(key).then(function (hit) {
				if (hit) return hit;
				return networkFetch(input, init).then(function (response) {
					return response.ok && response.body ? storing(response, cache, key, type) : response;
				});
			});
		}, function () { return networkFetch(input, init); });
	};
})();

<script>
(function () {
	function px(style, name) { return parseFloat(style[name]) || 0; }
	function fit() {
		const canvas = document.getElementById('canvas');
		let probe = document.getElementById('safe-area-probe');
		if (canvas && !probe && document.body) {
			probe = document.createElement('div');
			probe.id = 'safe-area-probe';
			document.body.appendChild(probe);
		}
		if (canvas && probe) {
			const vv = window.visualViewport;
			const safe = getComputedStyle(probe);
			const left = px(safe, 'paddingLeft');
			const top = px(safe, 'paddingTop');
			const width = Math.max(1, (vv ? vv.width : window.innerWidth) - left - px(safe, 'paddingRight'));
			const height = Math.max(1, (vv ? vv.height : window.innerHeight) - top - px(safe, 'paddingBottom'));
			const ratio = window.devicePixelRatio || 1;
			canvas.style.left = `${left}px`;
			canvas.style.top = `${top}px`;
			canvas.style.width = `${width}px`;
			canvas.style.height = `${height}px`;
			const pixelWidth = Math.floor(width * ratio);
			const pixelHeight = Math.floor(height * ratio);
			if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
			if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
		}
		requestAnimationFrame(fit);
	}
	requestAnimationFrame(fit);
})();

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28116984,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":""};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
